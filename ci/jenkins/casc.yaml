jenkins:
  systemMessage: "CartForge CI"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: github-pat
              username: ${GITHUB_OWNER}
              password: ${GITHUB_TOKEN}
unclassified:
  location:
    url: http://localhost:8090/